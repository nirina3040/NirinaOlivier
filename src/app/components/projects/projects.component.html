<section class="projects">
  <div class="container">
    <div class="section-header" [@fadeInUp]>
      <span class="section-tag">
        <i class="fas fa-laptop-code"></i> Réalisations
      </span>
      <h2 class="section-title">Mes Projets</h2>
      <p class="section-subtitle">Découvrez mes applications concrètes, projets d'apprentissage et architectures logicielles</p>
    </div>

    <!-- Filtres de Catégories -->
    <div class="filters-container" [@fadeInUp]>
      <div class="filters">
        <button 
          *ngFor="let category of categories"
          class="filter-btn"
          [class.active]="selectedCategory === category"
          (click)="filterProjects(category)">
          <span>{{ category }}</span>
        </button>
      </div>
    </div>

    <!-- Loader -->
    <div class="loader-box" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Chargement des réalisations...</p>
    </div>

    <!-- Grille de projets -->
    <div class="projects-grid" [@staggerFade] *ngIf="!isLoading && filteredProjects.length > 0">
      <app-project-card 
        *ngFor="let project of filteredProjects; trackBy: trackByProjectId"
        [project]="project">
      </app-project-card>
    </div>

    <!-- Message si aucun projet -->
    <div class="no-projects" *ngIf="!isLoading && filteredProjects.length === 0">
      <div class="no-projects-icon">
        <i class="fas fa-folder-open"></i>
      </div>
      <h3>Aucun projet trouvé</h3>
      <p>Aucun projet ne correspond à la catégorie sélectionnée.</p>
      <button class="reset-btn" (click)="filterProjects('Tous')">
        <i class="fas fa-redo"></i>
        <span>Voir tous les projets</span>
      </button>
    </div>

    <!-- Bannière / Bouton GitHub -->
    <div class="show-more" *ngIf="!isLoading && filteredProjects.length > 0">
      <a href="https://github.com/nirina3040" target="_blank" rel="noopener noreferrer" class="btn-more">
        <i class="fab fa-github"></i>
        <span>Explorer plus de dépôts sur GitHub</span>
        <i class="fas fa-arrow-right arrow-icon"></i>
      </a>
    </div>
  </div>
</section>
