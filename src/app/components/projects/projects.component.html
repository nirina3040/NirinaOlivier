<section class="projects">
  <div class="container">
    <div class="section-header" [@fadeInUp]>
      <h2 class="section-title">Mes Projets</h2>
      <p class="section-subtitle">Découvrez mes réalisations et projets d'apprentissage</p>
    </div>

    <!-- Filtres -->
    <div class="filters" [@fadeInUp]>
      <button 
        *ngFor="let category of categories"
        class="filter-btn"
        [class.active]="selectedCategory === category"
        (click)="filterProjects(category)">
        {{ category }}
      </button>
    </div>

    <!-- Loader -->
    <div class="loader" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>Chargement des projets...</p>
    </div>

    <!-- Grille de projets -->
    <div class="projects-grid" [@staggerFade] *ngIf="!isLoading && filteredProjects.length > 0">
      <app-project-card 
        *ngFor="let project of filteredProjects; trackBy: trackByProjectId"
        [project]="project">
      </app-project-card>
    </div>

    <!-- Message si aucun projet -->
    <div class="no-projects" *ngIf="!isLoading && filteredProjects.length === 0">
      <i class="fas fa-search"></i>
      <p>Aucun projet trouvé dans cette catégorie</p>
      <button class="reset-btn" (click)="filterProjects('Tous')">
        Voir tous les projets
      </button>
    </div>

    <!-- Bouton voir plus sur GitHub -->
    <div class="show-more" *ngIf="!isLoading && filteredProjects.length > 0">
      <a href="https://github.com/nirina3040" target="_blank" class="btn-more">
        <i class="fab fa-github"></i>
        Voir plus sur GitHub
      </a>
    </div>
  </div>
</section>
